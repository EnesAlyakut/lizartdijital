  <!-- Sağ Bölüm: Global Harita ve Bayrak Kartı -->
  <g transform="translate(680, 100)" filter="url(#shadowMed)">
    <rect width="420" height="475" rx="24" fill="#0d2123" stroke="#134e4a" stroke-width="2"/>
    <rect width="420" height="54" rx="24" fill="#071719"/>
    <text x="30" y="34" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#2dd4bf">Hedef Ülkeler &amp; Hasta Kazanımı</text>

    <!-- Ülke Kartları -->
    <g transform="translate(30, 80)">
      <rect width="360" height="64" rx="12" fill="#07191b"/>
      <text x="20" y="38" font-size="22">🇬🇧</text>
      <text x="60" y="30" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Birleşik Krallık (İngiltere)</text>
      <text x="60" y="48" font-family="system-ui,sans-serif" font-size="11" fill="#5eead4">Diş Estetiği &amp; Saç Ekimi · 58 Hasta / Ay</text>
    </g>

    <g transform="translate(30, 155)">
      <rect width="360" height="64" rx="12" fill="#07191b"/>
      <text x="20" y="38" font-size="22">🇩🇪</text>
      <text x="60" y="30" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Almanya &amp; Avusturya</text>
      <text x="60" y="48" font-family="system-ui,sans-serif" font-size="11" fill="#5eead4">Göz &amp; Ortopedi · 42 Hasta / Ay</text>
    </g>

    <g transform="translate(30, 230)">
      <rect width="360" height="64" rx="12" fill="#07191b"/>
      <text x="20" y="38" font-size="22">🇦🇪</text>
      <text x="60" y="30" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Körfez Ülkeleri (BAE, Katar)</text>
      <text x="60" y="48" font-family="system-ui,sans-serif" font-size="11" fill="#5eead4">Plastik Cerrahi &amp; VIP Paket · 34 Hasta / Ay</text>
    </g>

    <g transform="translate(30, 315)">
      <rect width="360" height="130" rx="14" fill="#041214"/>
      <text x="24" y="34" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#2dd4bf">VIP Hizmet Deneyimi</text>
      <text x="24" y="60" font-family="system-ui,sans-serif" font-size="12" fill="#99f6e4">✓ VIP Havalimanı Transferi &amp; Karşılama</text>
      <text x="24" y="82" font-family="system-ui,sans-serif" font-size="12" fill="#99f6e4">✓ 5 Yıldızlı Anlaşmalı Otel Konaklaması</text>
      <text x="24" y="104" font-family="system-ui,sans-serif" font-size="12" fill="#99f6e4">✓ Kendi Dilinde Kişisel Tercüman &amp; Asistan</text>
    </g>
  </g>
</svg>
