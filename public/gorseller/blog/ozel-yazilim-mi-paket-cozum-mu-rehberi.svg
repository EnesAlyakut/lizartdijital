<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgDev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowDev" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bgDev)"/>
  <circle cx="280" cy="200" r="280" fill="#06b6d4" opacity="0.08" filter="blur(80px)"/>
  <circle cx="920" cy="450" r="300" fill="#3b82f6" opacity="0.08" filter="blur(80px)"/>

  <!-- Sol Kart: Özel Yazılım (Custom Software) -->
  <g transform="translate(100, 100)" filter="url(#shadowDev)">
    <rect width="460" height="475" rx="24" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <rect width="460" height="54" rx="24" fill="#0f172a"/>
    <rect x="0" y="30" width="460" height="24" fill="#0f172a"/>
    <circle cx="28" cy="27" r="6" fill="#ef4444"/>
    <circle cx="48" cy="27" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="27" r="6" fill="#10b981"/>
    <text x="94" y="32" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Özel Yazılım Mimarisi (Custom App)</text>

    <!-- Header Banner -->
    <g transform="translate(30, 80)">
      <rect width="400" height="74" rx="14" fill="url(#cyanGrad)"/>
      <text x="24" y="34" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="#ffffff">ÖZEL YAZILIM ÇÖZÜMÜ</text>
      <text x="24" y="55" font-family="system-ui,sans-serif" font-size="12" fill="#e0f2fe">Tam İş Süreci Uyumu · Sıfır Lisans Bağımlılığı</text>
    </g>

    <!-- Özellikler -->
    <g transform="translate(30, 175)">
      <rect width="400" height="60" rx="12" fill="#0f172a"/>
      <text x="20" y="36" font-size="18">⚡</text>
      <text x="50" y="27" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Maksimum Performans &amp; Hız</text>
      <text x="50" y="46" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Gereksiz kod ve eklenti yükü olmadan saf mimari</text>
    </g>

    <g transform="translate(30, 250)">
      <rect width="400" height="60" rx="12" fill="#0f172a"/>
      <text x="20" y="36" font-size="18">🔒</text>
      <text x="50" y="27" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Şirkete Ait Veri ve Kaynak Kod</text>
      <text x="50" y="46" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Üçüncü taraf SaaS sunucularına bağımlı kalmazsınız</text>
    </g>

    <g transform="translate(30, 325)">
      <rect width="400" height="60" rx="12" fill="#0f172a"/>
      <text x="20" y="36" font-size="18">📈</text>
      <text x="50" y="27" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Sınırsız Büyüme &amp; API Entegrasyonu</text>
      <text x="50" y="46" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">ERP, CRM, muhasebe ve depo sistemleriyle tam uyum</text>
    </g>

    <rect x="30" y="405" width="400" height="42" rx="12" fill="#0369a1"/>
    <text x="230" y="431" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#ffffff">YÜKSEK ÖLÇEKLENEBİLİRLİK</text>
  </g>

  <!-- Sağ Kart: Paket Yazılım (SaaS) Karşılaştırma -->
  <g transform="translate(640, 100)" filter="url(#shadowDev)">
    <rect width="460" height="475" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect width="460" height="54" rx="24" fill="#0f172a"/>
    <rect x="0" y="30" width="460" height="24" fill="#0f172a"/>
    <circle cx="28" cy="27" r="6" fill="#ef4444"/>
    <circle cx="48" cy="27" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="27" r="6" fill="#10b981"/>
    <text x="94" y="32" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Hazır Paket Çözümler (Standart SaaS)</text>

    <!-- Header Banner -->
    <g transform="translate(30, 80)">
      <rect width="400" height="74" rx="14" fill="url(#amberGrad)"/>
      <text x="24" y="34" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="#ffffff">HAZIR PAKET ÇÖZÜM</text>
      <text x="24" y="55" font-family="system-ui,sans-serif" font-size="12" fill="#fef3c7">Hızlı Kurulum · Standart Süreçler</text>
    </g>

    <g transform="translate(30, 175)">
      <rect width="400" height="60" rx="12" fill="#0f172a"/>
      <text x="20" y="36" font-size="18">⏱️</text>
      <text x="50" y="27" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">1-3 Günde Kullanıma Hazır</text>
      <text x="50" y="46" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Sıfır geliştirme süresiyle hemen başlayın</text>
    </g>

    <g transform="translate(30, 250)">
      <rect width="400" height="60" rx="12" fill="#0f172a"/>
      <text x="20" y="36" font-size="18">💳</text>
      <text x="50" y="27" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Kullanıcı Başı Aylık Lisans</text>
      <text x="50" y="46" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Ekip büyüdükçe katlanan abonelik giderleri</text>
    </g>

    <g transform="translate(30, 325)">
      <rect width="400" height="60" rx="12" fill="#0f172a"/>
      <text x="20" y="36" font-size="18">⚠️</text>
      <text x="50" y="27" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Özelleştirme ve Entegrasyon Sınırları</text>
      <text x="50" y="46" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">İş modelinizi şablona uydurma zorunluluğu</text>
    </g>

    <rect x="30" y="405" width="400" height="42" rx="12" fill="#334155"/>
    <text x="230" y="431" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">STANDART İHTİYAÇLAR İÇİN</text>
  </g>
</svg>
