<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgSm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="50%" stop-color="#120d24"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="instaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ec4899" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bgSm)"/>
  <circle cx="200" cy="200" r="260" fill="#ec4899" opacity="0.12" filter="blur(80px)"/>
  <circle cx="1000" cy="450" r="300" fill="#8b5cf6" opacity="0.12" filter="blur(80px)"/>

  <!-- Sol Dashboard: İçerik & Etkileşim Paneli -->
  <g transform="translate(100, 100)">
    <rect width="520" height="475" rx="24" fill="#1b1130" stroke="#3b2063" stroke-width="2"/>
    <rect width="520" height="54" rx="24" fill="#130a24"/>
    <rect x="0" y="30" width="520" height="24" fill="#130a24"/>
    <circle cx="28" cy="27" r="6" fill="#ef4444"/>
    <circle cx="48" cy="27" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="27" r="6" fill="#10b981"/>
    <text x="94" y="32" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f472b6">Sosyal Medya Etkileşim &amp; İçerik Takvimi</text>

    <!-- Kart 1: Reels Performansı -->
    <g transform="translate(30, 80)">
      <rect width="460" height="74" rx="14" fill="#130926"/>
      <rect x="18" y="15" width="44" height="44" rx="12" fill="url(#instaGrad)"/>
      <text x="40" y="42" text-anchor="middle" font-size="20" fill="#ffffff">▶</text>
      <text x="76" y="33" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Dikey Video &amp; Reels Stratejisi</text>
      <text x="76" y="52" font-family="system-ui,sans-serif" font-size="12" fill="#c084fc">+%280 Organik Erişim · 42.5K İzlenme</text>
      <rect x="360" y="24" width="80" height="26" rx="13" fill="#10b981" opacity="0.2"/>
      <text x="400" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#34d399">YÜKSEK</text>
    </g>

    <!-- Kart 2: DM & Topluluk Yönetimi -->
    <g transform="translate(30, 170)">
      <rect width="460" height="74" rx="14" fill="#130926"/>
      <rect x="18" y="15" width="44" height="44" rx="12" fill="#8b5cf6"/>
      <text x="40" y="43" text-anchor="middle" font-size="20" fill="#ffffff">💬</text>
      <text x="76" y="33" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Hızlı DM Satış Hunisi (Funnel)</text>
      <text x="76" y="52" font-family="system-ui,sans-serif" font-size="12" fill="#c084fc">İlk 15 Dk Yanıt · %34 Sipariş Dönüşümü</text>
      <rect x="360" y="24" width="80" height="26" rx="13" fill="#10b981" opacity="0.2"/>
      <text x="400" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#34d399">AKTİF</text>
    </g>

    <!-- Kart 3: Kaydetme & Paylaşma -->
    <g transform="translate(30, 260)">
      <rect width="460" height="74" rx="14" fill="#130926"/>
      <rect x="18" y="15" width="44" height="44" rx="12" fill="#ec4899"/>
      <text x="40" y="42" text-anchor="middle" font-size="18" fill="#ffffff">🔖</text>
      <text x="76" y="33" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Değer Odaklı Eğitici Carousel</text>
      <text x="76" y="52" font-family="system-ui,sans-serif" font-size="12" fill="#c084fc">1.840 Kaydetme · Algoritma Öne Çıkarma</text>
      <rect x="360" y="24" width="80" height="26" rx="13" fill="#10b981" opacity="0.2"/>
      <text x="400" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#34d399">VİRAL</text>
    </g>

    <!-- Alt Metrik Çubuğu -->
    <g transform="translate(30, 355)">
      <rect width="460" height="90" rx="16" fill="url(#pinkGrad)"/>
      <text x="24" y="34" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#ffe4e6">Aylık Toplam Etkileşim &amp; Dönüşüm</text>
      <text x="24" y="68" font-family="system-ui,sans-serif" font-size="28" font-weight="900" fill="#ffffff">184.200+</text>
      <text x="185" y="66" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffe4e6">▲ %44 Artış</text>
    </g>
  </g>

  <!-- Sağ Bölüm: Telefon Mockup & Sosyal Feed -->
  <g transform="translate(680, 75)" filter="url(#glowSm)">
    <rect width="420" height="520" rx="36" fill="#160d26" stroke="#4a257a" stroke-width="3"/>
    <!-- Telefon Çentiği -->
    <rect x="145" y="16" width="130" height="24" rx="12" fill="#0c0717"/>
    <circle cx="255" cy="28" r="4" fill="#331e54"/>

    <!-- Feed Başlığı -->
    <text x="35" y="75" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">Lizart Dijital</text>
    <text x="35" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#a855f7">@lizartdijital · Sosyal Medya Ajansı</text>

    <!-- Post Görsel Alanı -->
    <rect x="35" y="115" width="350" height="230" rx="18" fill="url(#instaGrad)"/>
    <circle cx="210" cy="230" r="45" fill="#ffffff" opacity="0.2"/>
    <text x="210" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="900" fill="#ffffff">SOSYAL MEDYA</text>
    <text x="210" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#fff1f2">STRATEJİ REHBERİ 2026</text>

    <!-- Beğeni / Yorum Barı -->
    <text x="40" y="375" font-size="20">❤️</text>
    <text x="75" y="375" font-size="20">💬</text>
    <text x="110" y="375" font-size="20">🚀</text>
    <text x="355" y="375" font-size="20">🔖</text>

    <text x="40" y="415" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">12.450 beğeni</text>
    <text x="40" y="438" font-family="system-ui,sans-serif" font-size="12" fill="#cbd5e1">Markanızı doğru kitleyle buluşturan içerik kurgusu...</text>

    <rect x="35" y="460" width="350" height="34" rx="10" fill="#24143d"/>
    <text x="50" y="482" font-family="system-ui,sans-serif" font-size="12" fill="#a78bfa">Yorum ekle...</text>
  </g>
</svg>
