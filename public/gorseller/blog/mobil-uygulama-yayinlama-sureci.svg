    <rect x="25" y="130" width="190" height="230" rx="14" fill="#1e293b"/>
    <rect x="40" y="150" width="160" height="70" rx="8" fill="#334155"/>
    <rect x="40" y="235" width="75" height="100" rx="8" fill="#334155"/>
