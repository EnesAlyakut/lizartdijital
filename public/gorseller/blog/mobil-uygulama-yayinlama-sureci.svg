      <text x="20" y="25" text-anchor="middle" font-weight="800" fill="#022c19">2</text>
      <text x="50" y="18" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Derleme &amp; İmzalar</text>
