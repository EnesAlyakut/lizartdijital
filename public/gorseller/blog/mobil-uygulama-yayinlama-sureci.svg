  </defs>
  <rect width="1200" height="675" fill="url(#bg4)"/>
  <circle cx="600" cy="300" r="300" fill="#38bdf8" opacity="0.08" filter="blur(80px)"/>

  <!-- Sol Telefon: iOS / App Store -->
  <g transform="translate(220, 90)">
